spring.application.name=personal-knowledge-base

# PostgreSQL - update with your credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/knowledge_base
spring.datasource.username=aryankumar
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Anthropic API key - set via environment variable
anthropic.api.key=${Anthropic_key}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080
